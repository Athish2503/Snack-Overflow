name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || vars.POSTGRES_DB || 'snackoverflow_test' }}
          POSTGRES_HOST_AUTH_METHOD: ${{ secrets.POSTGRES_PASSWORD != '' && 'scram-sha-256' || 'trust' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
      PORT: ${{ vars.PORT }}
      CLIENT_URL: ${{ vars.CLIENT_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run Lint
        run: npm run lint

      - name: Run Type-Check
        run: npm run type-check

      - name: Push Database Schema
        run: npx prisma db push --schema=apps/api/prisma/schema.prisma

      - name: Seed Database
        run: npx tsx apps/api/prisma/seed.ts

      - name: Run API Tests
        run: npm --prefix apps/api test

      - name: Build Next.js & API
        run: npm run build
