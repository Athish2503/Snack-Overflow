services:
  # 1. Backend API (Express + Prisma)
  - type: web
    name: snack-overflow-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:api
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: snack-overflow-db
          property: connectionString
      - key: CLIENT_URL
        sync: false # Set to your deployed frontend URL (e.g., https://snack-overflow-web.onrender.com)
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true

  # 2. Frontend (Next.js)
  - type: web
    name: snack-overflow-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to your deployed backend URL (e.g., https://snack-overflow-api.onrender.com/api)

databases:
  # 3. PostgreSQL Database
  - name: snack-overflow-db
    plan: free
    region: oregon
    databaseName: snackoverflow
    user: snackoverflow
